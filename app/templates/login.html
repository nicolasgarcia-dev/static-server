<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - HTML Server & Explorer</title>
    <meta name="description" content="Acceso al panel de gestión de HTML Server & Explorer.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: rgba(20, 20, 25, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --accent-hover: #2563eb;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --input-bg: rgba(255, 255, 255, 0.04);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: #3b82f6;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.12);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 15% 15%, rgba(59, 130, 246, 0.08) 0px, transparent 50%),
                radial-gradient(at 85% 85%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.04);
            position: relative;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon-box {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid rgba(59, 130, 246, 0.4);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 0 20px var(--accent-glow);
            color: var(--accent);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: #e4e4e7;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 0.9rem;
            color: #71717a;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem 0.75rem 2.6rem;
            color: var(--text-main);
            font-size: 0.9375rem;
            font-family: inherit;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-input::placeholder {
            color: #52525b;
        }

        .form-row-check {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.8125rem;
        }

        .check-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .check-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 15px;
            height: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 0.8rem 1.25rem;
            font-size: 0.9375rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.15s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-submit:hover:not(:disabled) {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-box {
            display: none;
            background: var(--danger-bg);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-md);
            padding: 0.75rem 1rem;
            color: #fca5a5;
            font-size: 0.8125rem;
            line-height: 1.4;
            margin-bottom: 1.25rem;
            align-items: center;
            gap: 0.6rem;
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: #71717a;
            margin-top: 1.5rem;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon-box">
                    <i data-lucide="server" style="width: 24px; height: 24px;"></i>
                </div>
                <h1 class="brand-title">HTML Server</h1>
                <p class="brand-subtitle">Panel de gestión de archivos estáticos</p>
            </div>

            <div class="alert-box" id="login-alert" role="alert">
                <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
                <span id="login-alert-text">Error de autenticación</span>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i data-lucide="user" style="width: 16px; height: 16px;"></i>
                        </span>
                        <input
                            type="text"
                            id="username"
                            class="form-input"
                            placeholder="Nombre de usuario"
                            autocomplete="username"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
                        </span>
                        <input
                            type="password"
                            id="password"
                            class="form-input"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <div class="form-row-check">
                    <label class="check-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Mantener sesión iniciada</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    <span id="btn-text">Entrar al Panel</span>
                    <i data-lucide="arrow-right" style="width: 16px; height: 16px;" id="btn-arrow"></i>
                    <div class="spinner" id="btn-spinner" style="display: none;"></div>
                </button>
            </form>

            <div class="footer-note">
                <span>Servidor de contenidos estáticos multicuenta</span>
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }

        const form = document.getElementById('login-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberInput = document.getElementById('remember-me');
        const alertBox = document.getElementById('login-alert');
        const alertText = document.getElementById('login-alert-text');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnArrow = document.getElementById('btn-arrow');
        const btnSpinner = document.getElementById('btn-spinner');

        function showAlert(msg) {
            alertText.textContent = msg;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
        }

        function setLoading(loading) {
            btnSubmit.disabled = loading;
            if (loading) {
                btnText.textContent = 'Verificando...';
                btnArrow.style.display = 'none';
                btnSpinner.style.display = 'block';
            } else {
                btnText.textContent = 'Entrar al Panel';
                btnArrow.style.display = 'block';
                btnSpinner.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const username = usernameInput.value.trim().toLowerCase();
            const password = passwordInput.value;
            const remember = rememberInput.checked;

            if (!username || !password) {
                showAlert('Por favor, ingresa tu usuario y contraseña.');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });

                const data = await res.json();

                if (!res.ok) {
                    showAlert(data.detail || 'Error al iniciar sesión. Comprueba tus credenciales.');
                    setLoading(false);
                    return;
                }

                if (data.success) {
                    if (data.token) {
                        localStorage.setItem('html_server_token', data.token);
                    }
                    if (data.user) {
                        localStorage.setItem('html_server_user', JSON.stringify(data.user));
                    }
                    // Redirect to dashboard root
                    window.location.href = '/';
                } else {
                    showAlert('No se pudo iniciar sesión.');
                    setLoading(false);
                }
            } catch (err) {
                showAlert('Error de conexión con el servidor. Inténtalo de nuevo.');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
